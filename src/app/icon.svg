<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="55%" stop-color="#06a6c9"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12"
        flood-color="#003f5c" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Rounded background -->
  <rect
    x="16"
    y="16"
    width="480"
    height="480"
    rx="110"
    fill="url(#bg)"
  />

  <!-- Circular availability ring -->
  <path
    d="M315 105
       C223 65 115 118 89 218
       C60 328 139 423 249 427
       C337 430 407 380 435 305"
    fill="none"
    stroke="white"
    stroke-width="30"
    stroke-linecap="round"
  />

  <!-- Medical cross -->
  <g filter="url(#shadow)">
    <rect
      x="205"
      y="145"
      width="102"
      height="230"
      rx="25"
      fill="white"
    />

    <rect
      x="141"
      y="209"
      width="230"
      height="102"
      rx="25"
      fill="white"
    />
  </g>

  <!-- Digital pixels -->
  <rect x="342" y="86" width="34" height="34" rx="6" fill="white"/>
  <rect x="389" y="86" width="34" height="34" rx="6" fill="white"/>

  <rect x="342" y="133" width="34" height="34" rx="6" fill="white"/>
  <rect x="389" y="133" width="34" height="34" rx="6" fill="white"/>
  <rect x="436" y="133" width="24" height="24" rx="5" fill="white"/>

  <rect x="389" y="180" width="24" height="24" rx="5" fill="white"/>
  <rect x="428" y="180" width="18" height="18" rx="4" fill="white"/>
</svg>
